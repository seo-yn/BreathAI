spring.application.name=ttobagi-server

# 실행 프로파일: 지정이 없으면 local, 배포 서버는 SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

# DB 연결 정보
spring.datasource.url=${TTOBAGI_DB_URL}
spring.datasource.username=${TTOBAGI_DB_USERNAME}
spring.datasource.password=${TTOBAGI_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# AI
ai.server.url=${TTOBAGI_AI_SERVER}

# JPA 설정
# 스키마는 Flyway가 관리하고 JPA는 엔티티와 일치하는지만 검증한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway 설정
# 이미 테이블이 있는 DB에도 적용되도록 이력 테이블만 만들고 V1부터 실행한다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 파일 업로드 제한
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Email 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 시스템 관리자 코드
system.admin-code=${SYSTEM_ADMIN_CODE}

# 주소
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Swagger 외부 설정
swagger.contact-name=${SWAGGER_CONTACT_NAME}
swagger.contact-email=${SWAGGER_CONTACT_EMAIL}
swagger.production-url=${SWAGGER_PRODUCTION_URL}
