# 운영 배포용 설정
# 환경변수는 .env 파일이 아니라 서버에서 직접 주입한다

# SQL 로그는 기본으로 끈다
# 추적이 필요하면 서버 환경변수 LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG 를 넣고 재시작한다
logging.level.org.hibernate.SQL=WARN

# Swagger는 기본으로 끈다
# 필요하면 서버 환경변수 SWAGGER_ENABLED=true 를 넣고 재시작한다
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
