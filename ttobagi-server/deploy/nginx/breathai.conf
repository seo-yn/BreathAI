# /etc/nginx/sites-available/breathai 로 복사해 사용한다 (README 참고)
# 인증서는 Let's Encrypt IP 인증서(6일짜리)이고 certbot이 자동 갱신한다

# 80: 인증서 확인용 경로만 열고 나머지는 HTTPS로 보낸다
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# 443: BE(8080)로 전달
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/211.233.202.231/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/211.233.202.231/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 업로드 최대 크기 (BE 설정 100MB와 맞춤)
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE가 끊기거나 몰려서 오지 않도록 버퍼링을 끄고 대기 시간을 늘린다
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
