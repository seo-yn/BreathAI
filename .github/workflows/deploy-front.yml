name: Deploy Frontend

on:
  push:
    branches: [main]
    paths: ['ttobagi-front/**', '.github/workflows/deploy-front.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 수행한다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ttobagi-front   # 모노레포라 프론트 디렉터리에서 실행
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22                  # Vite 8 요구 버전
          cache: npm
          cache-dependency-path: ttobagi-front/package-lock.json

      - run: npm ci
      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # 프로젝트 사이트는 /<레포명>/ 하위에 배포된다
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # GitHub Pages는 서버 rewrite가 없어 /dashboard 직접 접속·새로고침이 404가 된다.
      # index.html을 404.html로 복사해두면 SPA 라우터가 경로를 이어받는다.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ttobagi-front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
